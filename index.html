<title>Sensoy Sports Management</title>

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Sensoy Sports Management">
<meta property="og:description" content="Sporcu yönetimi ve danışmanlık. İletişim: info@sensoysm.com">
<meta property="og:locale" content="tr_TR">
<meta property="og:image" content="/favicon-512.png">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #1F1F1F;
    --ink-soft: #292929;
    --ink-hard: #111111;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body{
    background: #FFFFFF;
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow-x: hidden;
  }

  .card{
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    /* içeriği dikey merkezin hafifçe üzerine taşır */
    margin-bottom: 36px;
  }

  /* ---------- Amblem ---------- */
  .mark{
    width: 118px;
    height: auto;
    display: block;
  }

  /* ---------- Wordmark ---------- */
  .wordmark{
    margin: 26px 0 0;
    font-size: clamp(45px, 9.1vw, 66px);
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.44em;
    /* son harften sonraki fazla boşluğu optik olarak dengeler */
    margin-right: -0.44em;
    color: var(--ink);
  }

  .tagline{
    margin: 14px 0 0;
    font-size: clamp(13px, 2.3vw, 17px);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.26em;
    margin-right: -0.26em;
    color: var(--ink-soft);
  }

  /* ---------- E-posta ---------- */
  .email{
    margin-top: 36px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--ink-hard);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color 200ms ease;
  }
  .email:hover,
  .email:focus-visible{ border-bottom-color: var(--ink-hard); }

  /* ---------- Sosyal ---------- */
  .social{
    margin-top: 31px;
    display: flex;
    align-items: center;
    gap: 50px;
  }

  .social a{
    display: inline-flex;
    color: #000000;
    transition: opacity 200ms ease;
  }
  .social a:hover,
  .social a:focus-visible{ opacity: 0.55; }

  .social svg{
    height: 27px;
    width: auto;
    fill: currentColor;
    display: block;
  }

  a:focus-visible{
    outline: 2px solid #B8912F;
    outline-offset: 6px;
    border-radius: 2px;
  }

  /* ---------- Mobil ---------- */
  @media (max-width: 600px){
    body{ padding: 32px 20px; }
    .mark{ width: 96px; }
    .wordmark{ margin-top: 21px; }
    .tagline{ margin-top: 11px; }
    .email{ margin-top: 29px; }
    .social{ margin-top: 26px; gap: 38px; }
    .social svg{ height: 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
